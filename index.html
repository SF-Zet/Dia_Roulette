<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디아2 래더 직업 뽑기</title>
<style>
  :root{
    --bg:#0e0b0a; --panel:#1a1412; --line:#3a2d27; --text:#e8dccb; --muted:#9a8a78;
    --gold:#c8a15a; --red:#a3261c; --red2:#d23a2b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1511 0%,var(--bg) 60%);color:var(--text);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}
  h1{margin:0 0 4px;font-size:28px;letter-spacing:1px;color:var(--gold);text-shadow:0 2px 12px #000}
  .sub{color:var(--muted);margin-bottom:22px;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px}
  .panel h2{margin:0 0 12px;font-size:15px;color:var(--gold);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .card{background:#140f0d;border:1px solid var(--line);border-radius:8px;padding:12px}
  .card input[type=text]{width:100%;background:#0e0b0a;border:1px solid var(--line);color:var(--text);
    padding:7px 9px;border-radius:6px;font-size:15px;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;
    color:var(--text);background:#201815;transition:.12s}
  .chip:hover{border-color:var(--gold)}
  .chip.off{background:#2a0f0c;border-color:var(--red);color:#7a5a55;text-decoration:line-through}
  .hint{font-size:12px;color:var(--muted);margin-bottom:8px}
  .pool .chip.off{opacity:.55}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row input[type=text]{background:#0e0b0a;border:1px solid var(--line);color:var(--text);padding:6px 9px;border-radius:6px}
  button{cursor:pointer;border:1px solid var(--line);background:#241a16;color:var(--text);padding:7px 14px;border-radius:6px;font-size:14px}
  button:hover{border-color:var(--gold)}
  .go{display:block;margin:6px auto 22px;padding:14px 46px;font-size:20px;font-weight:700;letter-spacing:2px;
    background:linear-gradient(#b8301f,#7d1a12);border:1px solid #e0624f;color:#fff;border-radius:8px;
    box-shadow:0 0 22px #a3261c66}
  .go:disabled{opacity:.5;cursor:default}
  .err{color:#ff8a7a;text-align:center;min-height:20px;margin-bottom:10px;font-size:14px}
  .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .res{background:#140f0d;border:1px solid var(--line);border-radius:10px;padding:18px 10px;text-align:center}
  .res .who{color:var(--muted);font-size:14px;margin-bottom:8px}
  .res .cls{font-size:26px;font-weight:700;color:var(--gold);min-height:36px}
  .res.spin .cls{color:#fff;opacity:.8}
  .res.done{border-color:var(--gold);box-shadow:0 0 18px #c8a15a33}
  .res.done .cls{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .x{color:var(--muted);cursor:pointer;margin-left:6px}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
  .res.done{animation:shake .45s ease}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
  .res.done .cls{text-shadow:0 0 14px #ffd27a,0 0 28px #c8a15a;font-size:30px}
  /* ===== 카드팩 깡 팝업 ===== */
  #pop{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;--c:#ffd27a;
    background:radial-gradient(circle at 50% 50%,#1a1030 0%,#05030a 78%);cursor:pointer;overflow:hidden}
  #pop.on{display:flex}
  #pop .rays{position:absolute;left:50%;top:50%;width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;opacity:0;pointer-events:none;
    background:repeating-conic-gradient(from 0deg,var(--c) 0 6deg,transparent 6deg 18deg);
    -webkit-mask:radial-gradient(circle,#000 0,transparent 52%);mask:radial-gradient(circle,#000 0,transparent 52%);
    animation:spinr 9s linear infinite;transition:opacity .5s}
  #pop .rays.on{opacity:.6}
  @keyframes spinr{to{transform:rotate(360deg)}}
  #pop .stage{position:relative;width:min(64vw,270px);aspect-ratio:5/7.2;perspective:900px}
  /* 팩 */
  #pop .pack{position:absolute;inset:0;display:flex;flex-direction:column;z-index:2;animation:drop .65s cubic-bezier(.2,.9,.3,1) both}
  @keyframes drop{0%{transform:translateY(-120vh) rotate(-10deg)}70%{transform:translateY(14px) rotate(2deg)}100%{transform:none}}
  #pop .pack.shake1{animation:sh1 .12s infinite;filter:drop-shadow(0 0 10px var(--c))}
  #pop .pack.shake2{animation:sh2 .1s infinite;filter:drop-shadow(0 0 22px var(--c))}
  #pop .pack.shake3{animation:sh3 .08s infinite;filter:drop-shadow(0 0 40px var(--c)) brightness(1.15)}
  @keyframes sh1{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  @keyframes sh2{0%,100%{transform:translate(0) rotate(0)}25%{transform:translate(-6px,2px) rotate(-2deg)}75%{transform:translate(6px,-2px) rotate(2deg)}}
  @keyframes sh3{0%,100%{transform:translate(0) rotate(0) scale(1.04)}20%{transform:translate(-10px,3px) rotate(-4deg) scale(1.07)}
    40%{transform:translate(9px,-4px) rotate(4deg) scale(1.04)}60%{transform:translate(-9px,-2px) rotate(-3deg) scale(1.07)}80%{transform:translate(10px,3px) rotate(3deg) scale(1.04)}}
  #pop .ph{flex:1;position:relative;background:linear-gradient(135deg,#5d6270,#dfe3ec 28%,#8a91a2 52%,#f1f4fa 74%,#666c7b);
    transition:transform .75s cubic-bezier(.3,0,.2,1),opacity .75s}
  #pop .ph.top{border-radius:14px 14px 0 0;clip-path:polygon(0 0,100% 0,100% 90%,88% 100%,72% 87%,55% 100%,38% 88%,20% 100%,0 89%)}
  #pop .ph.bot{border-radius:0 0 14px 14px;clip-path:polygon(0 11%,12% 0,28% 13%,45% 0,62% 12%,80% 0,100% 11%,100% 100%,0 100%)}
  #pop .plabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#262b36;
    text-shadow:0 1px 0 #fff9;transition:opacity .3s;pointer-events:none}
  #pop .plabel .band{position:absolute;left:0;right:0;top:41%;height:18%;background:var(--c);opacity:.9;z-index:-1}
  #pop .plabel .em{font-size:clamp(40px,12vw,64px);line-height:1}
  #pop .plabel b{font-size:clamp(20px,5.5vw,28px);letter-spacing:3px;margin-top:4px;color:#10131a}
  #pop .plabel small{font-size:12px;letter-spacing:4px;margin-top:4px;color:#10131a}
  #pop .pack.open{animation:none;filter:none}
  #pop .pack.open .ph.top{transform:translateY(-130%) rotate(-16deg);opacity:0}
  #pop .pack.open .ph.bot{transform:translateY(130%) rotate(12deg);opacity:0}
  #pop .pack.open .plabel{opacity:0}
  /* 카드 */
  #pop .card{position:absolute;inset:0;transform-style:preserve-3d;opacity:0;transform:scale(.3) rotateY(180deg);
    transition:transform .85s cubic-bezier(.3,1.25,.5,1),opacity .3s}
  #pop .card.in{opacity:1;transform:scale(1) rotateY(180deg)}
  #pop .card.flip{opacity:1;transform:scale(1) rotateY(0deg)}
  #pop .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
  #pop .face.back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#1b1330 0 10px,#241a40 10px 20px);
    border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:var(--c)}
  #pop .face.front{background:linear-gradient(160deg,#fff3b0 0%,#e2b341 38%,#8a5a12 100%);
    box-shadow:0 0 36px var(--c),0 0 90px var(--c)}
  #pop .front .inner{position:absolute;inset:7px;border-radius:12px;background:radial-gradient(circle at 50% 38%,#3a2412,#120a06);
    border:2px solid #fff3b099;overflow:hidden}
  #pop .front .art{position:absolute;left:0;right:0;top:12%;height:66%;display:flex;align-items:center;justify-content:center}
  #pop .front .art img{width:100%;height:100%;object-fit:contain}
  #pop .front .art .emo{font-size:min(24vw,120px)}
  #pop .front .top{position:absolute;left:10px;top:8px;font-weight:900;color:#ffe9a8;line-height:1.1;font-size:18px;text-align:center}
  #pop .front .nm{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:clamp(22px,7vw,32px);font-weight:900;color:#ffe9a8;
    text-shadow:0 0 12px var(--c),0 2px 0 #5a2a00}
  #pop .front .who{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:13px;color:#d8c08a;letter-spacing:3px}
  #pop .front .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffffaa 50%,transparent 65%);transform:translateX(-130%)}
  #pop .card.flip .shine{animation:shine 1.2s .45s ease-out forwards}
  @keyframes shine{to{transform:translateX(130%)}}
  #pop .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
  #pop .fl.on{animation:flashp .8s ease-out}
  @keyframes flashp{0%{opacity:.95}100%{opacity:0}}
  #pop .hint2{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#8d7f96;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="pop"></div>
<div class="wrap">
  <h1>⚔ 디아블로2 래더 직업 뽑기</h1>
  <div class="sub">친구별로 이전 시즌 직업을 제외하고, 직업이 겹치지 않게 랜덤 배정합니다. (클릭하면 제외 / 해제)</div>
  <div class="sub" style="margin-top:-14px;color:var(--gold)">🆕 v5 (11/06) · 당첨 팝업을 피파온라인식 카드팩 깡 연출로 변경 (+ 아마존 활 방향 수정)</div>

  <div class="panel">
    <label style="cursor:pointer;font-size:16px">
      <input type="checkbox" id="allowDup" style="transform:scale(1.3);margin-right:8px">
      직업 중복 허용 <span style="color:var(--muted);font-size:13px">(끄면 5명 모두 서로 다른 직업)</span>
    </label>
  </div>

  <div class="panel pool">
    <h2>전체 직업 풀 <span style="color:var(--muted);font-weight:400">— 꺼진 직업은 아무에게도 배정되지 않음</span></h2>
    <div class="chips" id="pool"></div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="newCls" placeholder="직업 추가 (예: 워락)">
      <button id="addCls">추가</button>
    </div>
  </div>

  <div class="panel">
    <h2>참가자별 제외 직업 <span style="color:var(--muted);font-weight:400">— 빨간색 취소선 = 이전 시즌에 플레이해서 제외</span></h2>
    <div class="grid" id="players"></div>
  </div>

  <div class="err" id="err"></div>
  <button class="go" id="go">뽑기!</button>

  <div class="panel">
    <h2>결과</h2>
    <div class="results" id="results"><div class="hint">뽑기 버튼을 누르세요.</div></div>
  </div>
</div>

<script>
const DEFAULT_CLASSES = ["아마존","네크로맨서","바바리안","팔라딘","소서리스","드루이드","어쌔신","악마술사"];
const PLAYER_NAMES = ["김기준","김지훈","김현우","정근호","정연호"];
const KEY = "dia_ladder_v2";

let state = load() || {
  allowDup: false,
  classes: DEFAULT_CLASSES.map(n => ({name:n, on:true})),
  players: PLAYER_NAMES.map(n => ({name:n, excl:[]}))
};
state.players.forEach((p,i) => p.name = PLAYER_NAMES[i]);

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const $ = id => document.getElementById(id);

function renderPool(){
  const el = $("pool"); el.innerHTML = "";
  state.classes.forEach((c,i)=>{
    const s = document.createElement("span");
    s.className = "chip" + (c.on ? "" : " off");
    s.textContent = c.name;
    s.onclick = () => { c.on = !c.on; save(); renderPool(); renderPlayers(); };
    if(!DEFAULT_CLASSES.includes(c.name)){
      const x = document.createElement("span"); x.className="x"; x.textContent="×";
      x.onclick = e => { e.stopPropagation();
        state.classes.splice(i,1);
        state.players.forEach(p => p.excl = p.excl.filter(n => n !== c.name));
        save(); renderPool(); renderPlayers(); };
      s.appendChild(x);
    }
    el.appendChild(s);
  });
}

function renderPlayers(){
  const el = $("players"); el.innerHTML = "";
  state.players.forEach(p=>{
    const card = document.createElement("div"); card.className = "card";
    const inp = document.createElement("input"); inp.type="text"; inp.value=p.name; inp.readOnly = true;
    card.appendChild(inp);
    const chips = document.createElement("div"); chips.className="chips";
    state.classes.filter(c=>c.on).forEach(c=>{
      const s = document.createElement("span");
      const ex = p.excl.includes(c.name);
      s.className = "chip" + (ex ? " off" : "");
      s.textContent = c.name;
      s.onclick = () => {
        p.excl = ex ? p.excl.filter(n=>n!==c.name) : [...p.excl, c.name];
        save(); renderPlayers();
      };
      chips.appendChild(s);
    });
    card.appendChild(chips);
    el.appendChild(card);
  });
}

$("addCls").onclick = () => {
  const v = $("newCls").value.trim();
  if(!v || state.classes.some(c=>c.name===v)) return;
  state.classes.push({name:v, on:true});
  $("newCls").value = "";
  save(); renderPool(); renderPlayers();
};
$("newCls").addEventListener("keydown", e => { if(e.key==="Enter") $("addCls").click(); });

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// 겹침 없이, 제외 조건을 만족하는 랜덤 배정 (백트래킹). 불가능하면 null.
function assign(){
  const pool = state.classes.filter(c=>c.on).map(c=>c.name);
  const opts = state.players.map(p => shuffle(pool.filter(n => !p.excl.includes(n))));
  const order = shuffle(state.players.map((_,i)=>i)).sort((a,b)=>opts[a].length-opts[b].length);
  const result = new Array(state.players.length);
  if(state.allowDup){
    for(let i=0;i<opts.length;i++){
      if(!opts[i].length) return null;
      result[i] = opts[i][0];
    }
    return result;
  }
  const used = new Set();
  function dfs(k){
    if(k===order.length) return true;
    const pi = order[k];
    for(const c of opts[pi]){
      if(used.has(c)) continue;
      used.add(c); result[pi]=c;
      if(dfs(k+1)) return true;
      used.delete(c);
    }
    return false;
  }
  return dfs(0) ? result : null;
}

// ===== 폭죽 효과 =====
const fx = $("fx"), g = fx.getContext("2d");
let parts = [], raf = null;
function resizeFx(){ fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", resizeFx); resizeFx();
const COLORS = ["#ffd27a","#ff5a3c","#ff9f1c","#fff3c4","#e63946","#7bdff2","#b8f35d","#f78fb3"];

function burst(x, y, n=70, power=1){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (2+Math.random()*6)*power;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.008+Math.random()*.014,
      size:2+Math.random()*3,color:COLORS[Math.floor(Math.random()*COLORS.length)],type:"spark"});
  }
  startFx();
}
function confettiRain(n=120){
  for(let i=0;i<n;i++){
    parts.push({x:Math.random()*fx.width,y:-20-Math.random()*200,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
      life:1,decay:.0035,size:5+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.3,
      color:COLORS[Math.floor(Math.random()*COLORS.length)],type:"conf"});
  }
  startFx();
}
function startFx(){ if(!raf) raf = requestAnimationFrame(tickFx); }
function tickFx(){
  g.clearRect(0,0,fx.width,fx.height);
  parts = parts.filter(p => p.life > 0 && p.y < fx.height + 40);
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if(p.type==="spark"){ p.vy += .09; p.vx *= .985; }
    else { p.rot += p.vr; p.vx += Math.sin(p.rot)*.05; }
    g.globalAlpha = Math.max(p.life,0);
    g.fillStyle = p.color;
    if(p.type==="spark"){ g.beginPath(); g.arc(p.x,p.y,p.size,0,Math.PI*2); g.fill(); }
    else { g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.fillRect(-p.size/2,-p.size/4,p.size,p.size/2); g.restore(); }
  }
  g.globalAlpha = 1;
  if(parts.length){ raf = requestAnimationFrame(tickFx); }
  else { raf = null; g.clearRect(0,0,fx.width,fx.height); }
}
function burstAt(el, n, power){
  const r = el.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, n, power);
}
function finale(){
  confettiRain(160);
  for(let i=0;i<6;i++){
    setTimeout(() => burst(innerWidth*(.15+Math.random()*.7), innerHeight*(.15+Math.random()*.45), 90, 1.3), i*220);
  }
}

// ===== 당첨 직업 팝업 =====
// img/ 폴더에 아래 파일명으로 이미지를 넣으면 표시되고, 없으면 이모지 카드로 대체됩니다.
const IMG_VER = "5"; // 그림을 바꿀 때 숫자를 올리면 브라우저 캐시를 무시하고 새로 불러옴
const CLASS_IMG = {
  "아마존":"img/amazon.svg","네크로맨서":"img/necromancer.svg","바바리안":"img/barbarian.svg",
  "팔라딘":"img/paladin.svg","소서리스":"img/sorceress.svg","드루이드":"img/druid.svg",
  "어쌔신":"img/assassin.svg","악마술사":"img/warlock.svg"
};
const CLASS_EMO = {"아마존":"🏹","네크로맨서":"💀","바바리안":"⚔️","팔라딘":"🛡️","소서리스":"❄️","드루이드":"🐺","어쌔신":"🗡️","악마술사":"😈"};
const CLASS_COLOR = {"아마존":"#7bd96b","네크로맨서":"#b27be0","바바리안":"#ff7a3c","팔라딘":"#ffd86b","소서리스":"#7fd6ff","드루이드":"#8fd16b","어쌔신":"#ff4a5a","악마술사":"#5dff4a"};

// ===== 사운드 (효과음) =====
let ac = null;
function audio(){ try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){} return ac; }
function beep(freq, dur, type="square", vol=.1, when=0){
  try{
    const a = audio(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(a.destination);
    const t = a.currentTime + when; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}

// 피파온라인식 카드팩 깡: 팩 낙하 → 점점 세게 흔들림 → 찢어짐+번쩍 → 카드 뒤집힘
function showPop(who, cls){
  return new Promise(resolve => {
    const pop = $("pop");
    pop.style.setProperty("--c", CLASS_COLOR[cls] || "#ffd27a");
    pop.innerHTML = `
      <div class="rays"></div>
      <div class="stage">
        <div class="card">
          <div class="face back">D2</div>
          <div class="face front"><div class="inner">
            <div class="top">D2<br><span class="em2"></span></div>
            <div class="art"></div><div class="nm"></div><div class="who"></div><div class="shine"></div>
          </div></div>
        </div>
        <div class="pack"><div class="ph top"></div><div class="ph bot"></div>
          <div class="plabel"><div class="band"></div><div class="em">⚔</div><b>DIABLO II</b><small>LADDER PACK</small></div>
        </div>
      </div>
      <div class="fl"></div>
      <div class="hint2">클릭하면 건너뜁니다</div>`;
    const q = s => pop.querySelector(s);
    q(".nm").textContent = cls; q(".who").textContent = who; q(".em2").textContent = CLASS_EMO[cls] || "🎲";
    const art = q(".art");
    const emo = () => { art.innerHTML = `<div class="emo">${CLASS_EMO[cls]||"🎲"}</div>`; };
    if(CLASS_IMG[cls]){
      const im = new Image(); im.alt = cls; im.onerror = emo; im.src = CLASS_IMG[cls] + "?v=" + IMG_VER; art.appendChild(im);
    } else emo();
    pop.classList.add("on");

    const pack = q(".pack"), card = q(".card"), rays = q(".rays"), fl = q(".fl");
    let timers = [], stage = 0, closed = false, revealedAt = 0;
    const T = (fn, ms) => timers.push(setTimeout(fn, ms));
    const cx = () => innerWidth/2, cy = () => innerHeight/2;

    const close = () => {
      if(closed) return; closed = true;
      timers.forEach(clearTimeout); pop.classList.remove("on"); pop.onclick = null; pop.innerHTML = ""; resolve();
    };
    const tear = () => {          // 팩 찢김 + 번쩍
      pack.className = "pack open"; rays.classList.add("on");
      fl.classList.remove("on"); void fl.offsetWidth; fl.classList.add("on");
      card.classList.add("in");
      beep(90,.5,"sine",.4); beep(55,.7,"sine",.4); beep(1200,.08,"square",.1);
      burst(cx(), cy(), 90, 1.4);
    };
    const flip = () => {          // 카드 공개
      card.classList.add("flip"); stage = 3; revealedAt = Date.now();
      [523,659,784,1047].forEach((f,i) => beep(f,.25,"triangle",.2,i*.1));
      burst(cx(), cy(), 140, 1.7);
      T(() => burst(cx()-90, cy()-60, 70, 1.2), 250);
      T(() => burst(cx()+90, cy()-40, 70, 1.2), 450);
      T(close, 2600);
    };

    // 타임라인
    beep(300,.25,"sawtooth",.08);
    T(() => { pack.className = "pack shake1"; }, 750);
    T(() => { pack.className = "pack shake2"; }, 1550);
    T(() => { pack.className = "pack shake3"; }, 2300);
    for(let t = 800; t < 2900; t += 160) T(() => beep(160 + (t-800)/2100*520, .07, "square", .06), t);
    T(() => { stage = 2; tear(); }, 3000);
    T(flip, 3650);

    pop.onclick = () => {
      if(closed) return;
      if(stage === 3){ if(Date.now() - revealedAt > 400) close(); return; }
      timers.forEach(clearTimeout); timers = [];     // 연출 건너뛰기 → 바로 공개
      if(stage < 2) tear();
      T(flip, 400);
    };
  });
}

let running = false;
$("go").onclick = async () => {
  if(running) return;
  audio(); // 효과음은 클릭 후에만 재생 가능
  const err = $("err"); err.textContent = "";
  const pool = state.classes.filter(c=>c.on);
  if(!state.allowDup && pool.length < state.players.length){
    err.textContent = `사용 가능한 직업(${pool.length})이 참가자(${state.players.length}명)보다 적습니다.`; return;
  }
  const res = assign();
  if(!res){
    err.textContent = state.allowDup
      ? "선택 가능한 직업이 없는 참가자가 있습니다. 제외를 줄여주세요."
      : "제외 조건 때문에 겹치지 않게 배정할 수 없습니다. 제외를 줄이거나 중복 허용을 켜세요."; return;
  }
  running = true; $("go").disabled = true;
  const box = $("results"); box.innerHTML = "";
  const cells = state.players.map(p=>{
    const d = document.createElement("div"); d.className="res spin";
    d.innerHTML = `<div class="who"></div><div class="cls">?</div>`;
    d.querySelector(".who").textContent = p.name || "(이름없음)";
    box.appendChild(d); return d;
  });
  const names = pool.map(c=>c.name);
  // 모두 동시에 돌리다가 순서대로 멈춤
  const timers = cells.map(d => setInterval(() => {
    d.querySelector(".cls").textContent = names[Math.floor(Math.random()*names.length)];
  }, 70));
  for(let i=0;i<cells.length;i++){
    await new Promise(r => setTimeout(r, 900 + i*500));
    clearInterval(timers[i]);
    cells[i].className = "res done";
    cells[i].querySelector(".cls").textContent = res[i];
    burstAt(cells[i], 80, 1.1);
    await showPop(state.players[i].name, res[i]);
  }
  finale();
  running = false; $("go").disabled = false;
};

$("allowDup").checked = !!state.allowDup;
$("allowDup").onchange = e => { state.allowDup = e.target.checked; save(); };

renderPool(); renderPlayers();
</script>
</body>
